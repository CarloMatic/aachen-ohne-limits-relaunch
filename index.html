<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aachen ohne Limits | Geschichten aus der Aachen Area</title>
  <meta name="description" content="Entdecken Sie Menschen, Unternehmen und Forschung aus der Aachen Area, die technologische, unternehmerische und europäische Grenzen verschieben." />
  
  <!-- Performance: Resource Preconnect -->
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />

  <!-- Security Meta Tags -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Place Branding Aachen e. V.",
    "alternateName": "Aachen ohne Limits",
    "url": "https://carlomatic.github.io/aachen-ohne-limits-relaunch/",
    "logo": "https://carlomatic.github.io/aachen-ohne-limits-relaunch/logos/logo_header_purple.png",
    "description": "Der Place Branding Aachen e. V. entwickelt und trägt die Standortmarke „Aachen ohne Limits". Gemeinsam mit Unternehmen und Institutionen macht die Initiative belegbare Leistungen, Menschen und Kooperationen aus der Aachen Area sichtbar.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Grüner Weg 106",
      "addressLocality": "Aachen",
      "postalCode": "52070",
      "addressCountry": "DE"
    },
    "sameAs": [
      "https://www.linkedin.com/company/aachen-ohne-limits",
      "https://www.instagram.com/aachenohnelimits",
      "https://www.facebook.com/aachenohnelimits",
      "https://www.youtube.com/@aachenohnelimits"
    ]
  }
  </script>

  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-light">
  <!-- Accessibility: Skip Link -->
  <a href="#app-root" class="sr-only focus:not-sr-only" style="position: absolute; top: -9999px; left: 1rem; z-index: 9999; padding: 0.5rem 1rem; background: var(--brand-accent); color: var(--bg-dark); font-weight: 700; border-radius: var(--radius-sm);" onfocus="this.style.top='1rem'" onblur="this.style.top='-9999px'">Zum Hauptinhalt springen</a>

  <!-- Header / Navigation -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="#home" class="brand-logo-link" id="logo-link" data-page="home">
        <!-- Official Logo SVG Switch (Violett for Light, Green for Dark) -->
        <div class="logo-img-wrapper">
          <img src="./logos/logo_header_purple.png" alt="Aachen ohne Limits Logo" class="logo-img" style="height: 100%; width: auto; object-fit: contain;" />
        </div>
      </a>

      <!-- Navigation Links – Phase 1 Launch Architecture -->
      <nav class="main-nav" id="main-nav">
        <ul class="nav-list">
          <li><a href="#stories" class="nav-link" data-page="stories">Stories</a></li>
          <li><a href="#news" class="nav-link" data-page="news">News</a></li>
          <li><a href="#initiative" class="nav-link" data-page="initiative">Initiative</a></li>
          <li><a href="#mitglieder" class="nav-link" data-page="mitglieder">Mitglieder</a></li>
          <li><a href="#mitmachen" class="nav-link" data-page="mitmachen">Mitmachen</a></li>
        </ul>
      </nav>

      <!-- Action Items & Primary CTA -->
      <div class="header-actions">
        <!-- Language Switch DE / EN -->
        <button id="lang-switch" class="btn-lang" title="Sprache wechseln / Switch Language">
          <span class="lang-code active">DE</span>
          <span class="lang-divider">/</span>
          <span class="lang-code">EN</span>
        </button>


        <!-- Primary Conversion CTA – "Mitgliedschaft" -->
        <a href="#mitgliedschaft" class="btn btn-primary" data-page="mitgliedschaft">
          <span class="btn-text">Mitgliedschaft</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

        <!-- Mobile Hamburger Button -->
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Menü öffnen">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container for Single Page Navigation & Views -->
  <main id="app-root">
    <!-- View content rendered via main.js -->
  </main>

  <!-- Global Modals Container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card" id="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Schließen">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
